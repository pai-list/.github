# CodeRabbit org-wide config
language: en-US
early_access: true
enable_free_tier: true

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    ignore_title_patterns:
      - "^(wip|WIP|draft|Draft):"
      - "^(chore|Chore).*"
    drafts: true
    base_branches:
      - "!(main)"

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: global
  issues:
    scope: global
  pull_requests:
    scope: global
